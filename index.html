<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIMAP Dataset</title>
  <link rel="stylesheet" href="styles.css?v=10" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="app.js?v=10" defer></script>
</head>
<body>
  <main class="container">
    <h1>SIMAP/NSynth-777 Text Label Distribution</h1>
    <div class="meta" id="meta">Loading data...</div>
    <div class="controls">
      <button id="toggle-reps" type="button">Hide SIMAP cluster representatives</button>
      <button id="toggle-nsynth-l1" type="button">Show NSynth-777: Family</button>
      <button id="toggle-nsynth-l2" type="button">Show NSynth-777: Source+Family</button>
      <button id="toggle-nsynth-l3" type="button">Show NSynth-777: Quality+Family</button>
    </div>
    <section class="audio-panel" aria-label="Cluster representative audio">
      <div class="audio-info">
        <div class="audio-label" id="audio-label">Select a representative marker to listen.</div>
      </div>
      <audio id="cluster-audio" controls preload="none"></audio>
    </section>
    <div id="plot"></div>
    <div class="error" id="error"></div>
  </main>
</body>
</html>
